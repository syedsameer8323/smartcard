<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCart — Good finds. Smarter choices.</title>
    <meta name="theme-color" content="#08090D" />
    <meta name="description" content="Discover everyday essentials and thoughtful upgrades at SmartCart." />
    <link rel="icon" type="image/png" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
      <script>
      /* Apply the saved theme before first paint (customer screens only; seller/admin stay light). */
      (function () {
        try {
          var p = location.pathname;
          if (p.indexOf("/seller") === 0 || p.indexOf("/admin") === 0) { document.documentElement.dataset.theme = "light"; return; }
          var t = localStorage.getItem("sc_theme");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
